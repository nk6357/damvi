name: Deploy DAMVI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: damvi-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: node scripts/build-pages.mjs "$PAGES_BASE_PATH"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify SEO pages
        run: |
          node scripts/build-seo.mjs
          node scripts/check-seo.mjs
          node scripts/build-seo.mjs --local
          node scripts/check-search-readiness.mjs
          node scripts/check-navigation.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
